<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- VedaTime Sacred Sun/Lotus Logo -->
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8722A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9A5C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle (sacred geometry) -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#saffronGrad)" stroke-width="12"/>
  
  <!-- Sun rays (12 directions) -->
  <g stroke="url(#saffronGrad)" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="40" x2="256" y2="96"/>
    <line x1="256" y1="416" x2="256" y2="472"/>
    <line x1="40" y1="256" x2="96" y2="256"/>
    <line x1="416" y1="256" x2="472" y2="256"/>
    <line x1="113" y1="113" x2="152" y2="152"/>
    <line x1="360" y1="360" x2="399" y2="399"/>
    <line x1="399" y1="113" x2="360" y2="152"/>
    <line x1="152" y1="360" x2="113" y2="399"/>
    <line x1="180" y1="74" x2="205" y2="126"/>
    <line x1="332" y1="438" x2="307" y2="386"/>
    <line x1="438" y1="180" x2="386" y2="205"/>
    <line x1="74" y1="332" x2="126" y2="307"/>
  </g>
  
  <!-- Central lotus/sun -->
  <circle cx="256" cy="256" r="80" fill="url(#goldGrad)"/>
  
  <!-- Lotus petals (8 directions) -->
  <g fill="url(#saffronGrad)">
    <ellipse cx="256" cy="196" rx="24" ry="40"/>
    <ellipse cx="256" cy="316" rx="24" ry="40"/>
    <ellipse cx="196" cy="256" rx="40" ry="24"/>
    <ellipse cx="316" cy="256" rx="40" ry="24"/>
    <ellipse cx="213" cy="213" rx="24" ry="40" transform="rotate(45 213 213)"/>
    <ellipse cx="299" cy="299" rx="24" ry="40" transform="rotate(45 299 299)"/>
    <ellipse cx="299" cy="213" rx="24" ry="40" transform="rotate(-45 299 213)"/>
    <ellipse cx="213" cy="299" rx="24" ry="40" transform="rotate(-45 213 299)"/>
  </g>
  
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="48" fill="#FEFCF9"/>
  
  <!-- Om symbol (simplified) -->
  <text x="256" y="280" font-family="serif" font-size="56" font-weight="bold" fill="url(#saffronGrad)" text-anchor="middle">ॐ</text>
</svg>
