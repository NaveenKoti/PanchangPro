name: CI

on:
  push:
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Panchang dates are IST-anchored: `new Date(y,m,d)` means IST midnight
    # in tests. Without this, UTC runners shift Udaya-tithi by a day (red CI
    # on all pushes Sep 18-19). Belt-and-braces with the TZ in `npm test`.
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
